    <!-- Google reads the rel="icon" on the home page and needs a square icon
         comfortably larger than 48x48. The PNG is listed first because it is the
         most broadly supported format; the SVG stays for crisp browser tabs.
         /favicon.ico must be a real image file — the SPA catch-all used to answer
         that path with index.html, so the default favicon lookup got HTML. -->

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
