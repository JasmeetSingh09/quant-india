# Every night, after the scan, check production itself: did the scan finish, did
# failures jump, are dozens of stocks that were scoring failing night after night
# (a data problem on our side), and does the Portfolio Lab audit still pass. A red run emails the
# person who last changed this schedule. Details in the run's summary and log.
#
# Read-only against production. See backend/tests/nightly_production_check.py.
#
# GitHub pauses scheduled workflows in a public repository after 60 days with
# no commits. If the nightly emails stop, check the Actions tab first.

name: Nightly production check

on:
  schedule:
    - cron: "30 3 * * *"          # 03:30 UTC; the scan starts about 00:02 and takes about 2.5 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-production
  cancel-in-progress: false

jobs:
  # Its own job so the failure email names it: "Production is up" failing means the
  # app is unreachable (down, suspended, or crashing), not a data warning.
  up:
    name: Production is up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reach the API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60                    -A quant-india-nightly https://quant-india.onrender.com/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          echo "::error::Production API is unreachable (last HTTP $code). Check the Render dashboard: suspended, crashed or deploying."
          exit 1

  production:
    name: Data checks (last night's scan, Portfolio Lab)
    needs: up
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check production
        run: python backend/tests/nightly_production_check.py
